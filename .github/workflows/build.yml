name: Build KT6PRO Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc rsync wget unzip zlib1g-dev

      - name: Clone Source Code
        run: |
          git clone -b v23.05.4 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Config
        run: |
          if [ -f kt6pro.config ]; then
            cp kt6pro.config openwrt/.config
          fi
          cd openwrt
          make defconfig

      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KT6PRO_Stable_Binaries
          path: openwrt/bin/targets/qualcommax/ipq50xx/
