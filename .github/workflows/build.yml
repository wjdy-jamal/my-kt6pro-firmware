name: Build KT6PRO Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc rsync wget unzip zlib1g-dev python3

      - name: Clone and Update
        run: |
          git clone -b v23.05.4 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          # هذه الخطوة تجبر النظام على اختيار جهازك بدقة
          echo "CONFIG_TARGET_qualcommax=y" > openwrt/.config
          echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> openwrt/.config
          echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_glinet_gl-ax1800=y" >> openwrt/.config
          
          # دمج إعداداتك الإضافية إذا وجدت
          [ -f kt6pro.config ] && cat kt6pro.config >> openwrt/.config
          
          cd openwrt
          make defconfig

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KT6PRO_Stable_Binaries
          path: openwrt/bin/targets/qualcommax/ipq60xx/*.bin
