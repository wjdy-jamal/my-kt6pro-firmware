name: Build KT6PRO Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc rsync wget unzip zlib1g-dev python3

      - name: Clone and Update
        run: |
          git clone -b openwrt-23.05 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          # مسح الإعدادات القديمة تماماً وفرض إعدادات كوالكوم
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_glinet_gl-ax1800=y" >> .config
          
          # تفعيل تعريفات السويتش والشبكة
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv=y" >> .config
          
          make defconfig

      - name: Build
        run: |
          cd openwrt
          # البناء مع عرض الأخطاء إذا وجدت
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KT6PRO_Stable_Binaries
          path: openwrt/bin/targets/qualcommax/ipq60xx/*.bin
